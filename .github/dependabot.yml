version: 2
updates:
  # The only ecosystem this repo can meaningfully use: rendercv is pip-installed
  # inline in a run step and the container image lives in `jobs.*.container`,
  # neither of which Dependabot can see.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # One PR for all action bumps rather than one per action.
      actions:
        patterns:
          - "*"
